<script>
// ===== TEMPEL URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI (berakhiran /exec) =====
const API_URL="https://script.google.com/macros/s/AKfycbyWRmAIpN9_67NHfgXcONcQkxCv28NeEW31BkadT9MFOxxZUbzmfvT50kkC1RH3zWGF9Q/exec";
// ======================================================================================
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
let token="",last={},tmr=null,busy=false,stTxt="";
let db=load(),me=null,tab="",sel={};
function load(){return{cfg:{},kelas:[],mapel:[],users:[],siswa:[],nilai:{},hadir:{}}}
/* ---------- Sinkronisasi dengan Google Sheets (via Apps Script) ---------- */
async function api(action,body){
if(API_URL.startsWith("PASTE"))throw new Error("API_URL belum diisi di index.html");
let j;try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,token},body))});j=await r.json()}catch(e){throw new Error("Tidak dapat terhubung ke server. Periksa API_URL, koneksi, dan pengaturan deploy (akses: Siapa saja).")}
if(!j.ok)throw new Error(j.error||"Terjadi kesalahan");return j}
function flat(d){const o={cfg:JSON.stringify(d.cfg)};
[["kelas","kelas","id"],["mapel","mapel","id"],["siswa","siswa","id"],["user","users","u"]].forEach(a=>d[a[1]].forEach(x=>o[a[0]+":"+x[a[2]]]=JSON.stringify(x)));
["nilai","hadir"].forEach(c=>Object.keys(d[c]).forEach(k=>o[c+":"+k]=JSON.stringify(d[c][k])));return o}
function unflat(m){const d=load();for(const k in m){const i=k.indexOf(":"),c=k.slice(0,i),v=JSON.parse(m[k]);
if(k==="cfg")d.cfg=v;else if(c==="nilai"||c==="hadir")d[c][k.slice(i+1)]=v;else d[c==="user"?"users":c].push(v)}return d}
async function loadAll(){const j=await api("load");db=unflat(j.data);last=flat(db)}
function setSt(t){stTxt=t;const e=$("#st");if(e)e.textContent=t}
function save(){clearTimeout(tmr);setSt("Menyimpan…");tmr=setTimeout(sync,700)}
async function sync(){if(busy){tmr=setTimeout(sync,500);return}

const UH=["username","password","nama","peran","kelas","mapel"];
function csvDl(name,rows){const q=c=>{c=String(c==null?"":c);return/[";,\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c};
const t="\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n"),a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function nm(list,ids){return(ids||[]).map(i=>(list.find(k=>k.id===i)||{}).nama).filter(Boolean).join("|")}
function expU(){if(!db.users.length){toast("Belum ada pengguna");return}
csvDl("pengguna_"+new Date().toISOString().slice(0,10)+".csv",[UH].concat(db.users.map(u=>[u.u,"",u.nama,RL[u.role]||u.role,nm(db.kelas,u.kelas),nm(db.mapel,u.mapel)])));toast("Pengguna diekspor: "+db.users.length)}
function tplU(){const k=db.kelas.map(x=>x.nama),m=db.mapel.map(x=>x.nama);
csvDl("template_pengguna.csv",[UH,["guru1","sandi123","Nama Guru",RL.guru,k[0]||"X IPA 1",m[0]||"Matematika"],["wali1","sandi123","Nama Wali Kelas",RL.wali,k[0]||"X IPA 1",""],["admin2","sandi123","Nama Admin",RL.admin,"",""]])}
function csvParse(t){t=t.replace(/^\ufeff/,"");let s=null,m=t.match(/^sep=(.)\r?\n/i);if(m){s=m[1];t=t.slice(m[0].length)}
if(!s){const l=t.split(/\r?\n/)[0],c=[";",",","\t"].map(x=>l.split(x).length);s=[";",",","\t"][c.indexOf(Math.max.apply(null,c))]}
const rows=[];let r=[],c="",q=false;
for(let i=0;i<t.length;i++){const ch=t[i];
if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
else if(ch==='"')q=true;
else if(ch===s){r.push(c);c=""}
else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}
else c+=ch}
if(c!==""||r.length){r.push(c);rows.push(r)}return rows}
function impU(inp){const f=inp.files[0];inp.value="";if(!f)return;const r=new FileReader();r.onload=()=>doImpU(String(r.result));r.onerror=()=>toast("Gagal membaca file");r.readAsText(f)}
function doImpU(text){const all=csvParse(text);if(!all.length){toast("File kosong");return}
const al={u:["username","user","u"],p:["password","sandi","kata sandi","pass"],n:["nama","nama lengkap"],r:["peran","role"],k:["kelas"],m:["mapel","mata pelajaran"]},H=all[0].map(x=>x.trim().toLowerCase()),ix={};
for(const k in al)ix[k]=H.findIndex(h=>al[k].includes(h));
if(ix.u<0||ix.n<0||ix.r<0){toast("Header harus memuat kolom: username, nama, peran");return}
const g=(r,k)=>ix[k]<0?"":(r[ix[k]]||"").trim(),RM={admin:"admin",guru:"guru",wali:"wali","wali kelas":"wali"},
find=(list,names,lbl,er)=>{const o=[];names.forEach(n=>{const x=list.find(y=>y.nama.trim().toLowerCase()===n.toLowerCase());x?o.push(x.id):er.push(lbl+" '"+n+"' tidak ditemukan")});return o},
seen={},ops=[],err=[];let nw=0,up=0;
all.slice(1).forEach((r,i)=>{if(!r.some(c=>c.trim()))return;const ln="Baris "+(i+2),e=[],u=g(r,"u"),n=g(r,"n"),p=ix.p<0?"":(r[ix.p]||""),role=RM[g(r,"r").toLowerCase()];
if(!u)e.push("username kosong");else if(seen[u.toLowerCase()])e.push("username ganda di file");
if(!n)e.push("nama kosong");if(!role)e.push("peran tidak valid");
const sp=x=>x?x.split("|").map(y=>y.trim()).filter(Boolean):[];
let kl=role==="admin"?[]:find(db.kelas,sp(g(r,"k")),"kelas",e),mp=role==="guru"?find(db.mapel,sp(g(r,"m")),"mapel",e):[];
const ex=db.users.find(x=>x.u===u);
if(role&&role!=="admin"&&!kl.length&&!e.length)e.push("pilih minimal satu kelas");
if(role==="guru"&&!mp.length&&!e.length)e.push("guru butuh minimal satu mapel");
if(!ex&&!p&&u)e.push("password wajib untuk pengguna baru");
if(ex&&u===me.u&&role&&role!==me.role)e.push("tidak boleh mengubah peran akun sendiri");
if(u)seen[u.toLowerCase()]=1;
if(e.length){err.push(ln+" ("+(u||"?")+"): "+e.join(", "));return}
ex?up++:nw++;ops.push({u,p,nama:n,role,kelas:kl,mapel:mp,ex:!!ex})});
if(!ops.length){toast(err.length?err[0]:"Tidak ada data pengguna");return}
let msg="Impor "+nw+" pengguna baru dan perbarui "+up+" pengguna.";
if(err.length)msg+=" "+err.length+" baris dilewati: "+err.slice(0,3).join("; ")+(err.length>3?"; …":"")+".";
ask(msg+" Lanjutkan?",()=>{ops.forEach(o=>{if(o.ex){const x=db.users.find(y=>y.u===o.u);x.nama=o.nama;x.role=o.role;x.kelas=o.kelas;x.mapel=o.mapel;if(o.p)x.p=o.p}
else db.users.push({u:o.u,p:o.p,nama:o.nama,role:o.role,kelas:o.kelas,mapel:o.mapel})});
save();render();toast("Impor selesai: "+nw+" baru, "+up+" diperbarui"+(err.length?", "+err.length+" dilewati":""))})}
function restore(){let d;try{d=JSON.parse($("#rs").value);if(!d.users||!d.siswa)throw 0}catch(e){toast("Data cadangan tidak valid");return}ask("Timpa semua data dengan cadangan?",()=>{db=d;save();me=db.users.find(x=>x.u===me.u)||db.users[0];render();toast("Data dipulihkan")})}

const V={nilai:vNilai,siswa:vSiswa,hadir:vHadir,cetak:vCetak,master:vMaster};
function render(){const A=$("#app");
if(!me){A.innerHTML=`<div class="card login"><h3>Raport Mid – Madrasah Aliyah (K13)</h3><input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><div id="err" class="dg"></div><button class="pri" onclick="login()">Masuk</button><div class="mu" style="font-size:12px">Lupa sandi? Hubungi admin madrasah.</div></div>`;return}
const tabs=Object.keys(TABS).filter(t=>TABS[t][1].includes(me.role));
A.innerHTML=`<header class="noprint"><b>${esc(db.cfg.nama)} · Raport Mid K13</b><span id="st">${stTxt}</span><span>${esc(me.nama)} (${RL[me.role]})</span><button onclick="token='';me=null;render()">Keluar</button></header><nav class="noprint">${tabs.map(t=>`<button class="${t===tab?"on":""}" onclick="tab='${t}';render()">${TABS[t][0]}</button>`).join("")}</nav><main>${V[tab]()}</main>`}
render();
</script></body></html>
